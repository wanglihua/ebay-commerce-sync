##### Database connection settings #####
jdbc.driverClass=com.mysql.jdbc.Driver
# jdbc.driverClass=com.microsoft.sqlserver.jdbc.SQLServerDriver
# jdbc.driverClass=org.postgresql.Driver
#####
##### SQL dialect #####
hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
# hibernate.dialect=org.hibernate.dialect.SQLServer2008Dialect
# hibernate.dialect=org.hibernate.dialect.ProgressDialect
#####
jdbc.jdbcUrl=jdbc:mysql://localhost:3306/ozoerp?useUnicode=true&amp;characterEncoding=UTF-8
# jdbc.jdbcUrl=jdbc:sqlserver://localhost:1433;databaseName=Shop
# jdbc.jdbcUrl=jdbc:postgresql://localhost:5432/ozosync
jdbc.user=ozoerp
jdbc.password=ozoerp_2017
#####
##### JDBC connection pool (C3P0) #####
# \u6700\u5C0F\u8FDE\u63A5\u6570
c3p0.pool.minPoolSize=5
# \u6700\u5927\u8FDE\u63A5\u6570
c3p0.pool.maxPoolSize=20
# \u521D\u59CB\u5316\u8FDE\u63A5\u6C60\u7684\u5927\u5C0F
c3p0.pool.initialPoolSize=5
# \u6700\u5927\u7684PreparedStatement\u7684\u6570\u91CF
c3p0.pool.maxStatements=50
# \u5F53\u8FDE\u63A5\u6C60\u91CC\u9762\u7684\u8FDE\u63A5\u7528\u5B8C\u7684\u65F6\u5019\uFF0CC3P0\u83B7\u53D6\u7684\u65B0\u7684\u8FDE\u63A5\u6570
c3p0.pool.acquireIncrement=2
# \u8FDE\u63A5\u7684\u8D85\u65F6\u65F6\u95F4
c3p0.pool.checkoutTimeout=1800
# \u68C0\u67E5\u8FDE\u63A5\u6C60\u91CC\u7A7A\u95F2\u8FDE\u63A5\u65F6\u95F4
c3p0.pool.idleConnectionTestPeriod=120
# \u9A8C\u8BC1\u8FDE\u63A5\u662F\u5426\u53EF\u7528
c3p0.pool.testConnectionOnCheckout=false
#####
##### update validate create create-drop none #####
# todo:\u6B63\u5F0F\u90E8\u7F72\u65F6\u6539\u6210\u8FD9\u4E2A\u914D\u7F6E\u6BD4\u8F83\u597D hibernate.hbm2ddl.auto=none
hibernate.hbm2ddl.auto=validate
#####
##### Echo all executed SQL to stdout #####
hibernate.show_sql=true
hibernate.format_sql=true
